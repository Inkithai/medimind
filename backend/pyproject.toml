[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

# api.py is an app-assembly file whose import block deliberately sits after
# load_dotenv() so env vars are present before module-level configuration is
# read (CORS origins, metrics token). The import order is intentional and
# documented there.
[tool.ruff.lint.per-file-ignores]
"api.py" = ["E402", "I001"]

[tool.ruff.format]
quote-style = "double"